<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像比較アンケート</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; text-align: center; }
        .criterion-box { background: #f8f9fa; border: 2px solid #007bff; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .criterion-text { font-size: 24px; font-weight: bold; color: #007bff; }
        .comparison-container { display: flex; gap: 20px; justify-content: center; }
        .card { flex: 1; border: 2px solid #ddd; padding: 15px; border-radius: 10px; cursor: pointer; background: #fff; transition: transform 0.1s; }
        .card:hover { border-color: #007bff; transform: translateY(-2px); }
        .card img { max-width: 100%; height: 280px; object-fit: contain; }
        .btn { margin-top: 10px; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; }
        @media (max-width: 600px) { .comparison-container { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="criterion-box">
        より <span id="criterionText" class="criterion-text"></span> 方を選んでクリックしてください
    </div>

    <div class="comparison-container">
        <div class="card" onclick="selectImage('left')">
            <img id="imgLeft" src="" alt="左画像">
            <button class="btn">こちらを選ぶ</button>
        </div>
        <div class="card" onclick="selectImage('right')">
            <img id="imgRight" src="" alt="右画像">
            <button class="btn">こちらを選ぶ</button>
        </div>
    </div>

    <script>
        // ★ステップ1で取得したGASのWebアプリURLに差し替えてください
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";

        // ★GitHubにアップロードした画像ファイル名の一覧
        // ※拡張子（.jpgや.png）やカッコ・スペースがGitHub上のファイル名と完全一致しているか確認してください
        const imageList = [
            // ブラウス (blouse)
            "blouse_red (1).jpg",
            "blouse_blue (1).jpg",
            "blouse_black (1).jpg",
            "blouse_white (1).jpg",

            // ドレス (dress)
            "dress_red (1).jpg",
            "dress_blue (1).jpg",
            "dress_black (1).jpg",
            "dress_white (1).jpg",

            // ジャケット (jacket)
            "jacket_red (1).jpg",
            "jacket_blue (1).jpg",
            "jacket_black (1).jpg",
            "jacket_white (1).jpg",

            // セーター (sweater)
            "sweater_red (1).jpg",
            "sweater_blue (1).jpg",
            "sweater_black (1).jpg",
            "sweater_white (1).jpg"
        ];

        // 評価基準（属性）のリスト
        const criteriaList = ["おしゃれな", "フォーマルな", "スタイリッシュな", "好みな"];

        let currentLeft = "";
        let currentRight = "";
        let currentCriterion = "";
        
        // 回答者を識別するランダムID（セッションID）
        let respondentId = "R_" + Math.floor(Math.random() * 899999 + 100000);

        // 2枚をランダムに選出して表示する関数
        function nextPair() {
            if (imageList.length < 2) {
                alert("画像リストには少なくとも2枚以上の画像を設定してください。");
                return;
            }

            // ランダムに並び替えて先頭2枚を取得
            let shuffled = [...imageList].sort(() => 0.5 - Math.random());
            currentLeft = shuffled[0];
            currentRight = shuffled[1];
            
            // 評価基準をランダム選択
            currentCriterion = criteriaList[Math.floor(Math.random() * criteriaList.length)];

            document.getElementById("imgLeft").src = currentLeft;
            document.getElementById("imgRight").src = currentRight;
            document.getElementById("criterionText").innerText = `「${currentCriterion}」`;
        }

        // 画像選択時の処理（スプレッドシートへ送信）
        function selectImage(winnerSide) {
            const winnerImg = winnerSide === 'left' ? currentLeft : currentRight;
            const loserImg = winnerSide === 'left' ? currentRight : currentLeft;

            const payload = {
                respondent_id: respondentId,
                criterion: currentCriterion,
                winner_img: winnerImg,
                loser_img: loserImg
            };

            // GASへバックグラウンド送信（CORSエラーを回避するため no-cors モード）
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Data send error:", err));

            // 即座に次の比較ペアを表示
            nextPair();
        }

        // ページ読み込み時に最初のペアを表示
        nextPair();
    </script>
</body>
</html>
