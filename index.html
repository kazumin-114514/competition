<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2枚の画像比較アンケート</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; text-align: center; }
        .criterion-box { background: #f8f9fa; border: 2px solid #007bff; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .criterion-text { font-size: 24px; font-weight: bold; color: #007bff; }
        .comparison-container { display: flex; gap: 20px; justify-content: center; }
        .card { flex: 1; border: 2px solid #ddd; padding: 15px; border-radius: 10px; cursor: pointer; background: #fff; }
        .card:hover { border-color: #007bff; }
        .card img { max-width: 100%; height: 250px; object-fit: contain; }
        .btn { margin-top: 10px; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; width: 100%; font-weight: bold; }
        @media (max-width: 600px) { .comparison-container { flex-direction: column; } }
    </style>
</head>
<body>

    <div class="criterion-box">
        より <span id="criterionText" class="criterion-text"></span> 方を選んでクリックしてください
    </div>

    <div class="comparison-container">
        <div class="card" onclick="selectImage('left')">
            <img id="imgLeft" src="" alt="左画像">
            <button class="btn">こちらを選ぶ</button>
        </div>
        <div class="card" onclick="selectImage('right')">
            <img id="imgRight" src="" alt="右画像">
            <button class="btn">こちらを選ぶ</button>
        </div>
    </div>

    <script>
        // ★ここにステップ1で取得したGASのウェブアプリURLを貼り付けます★
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxisZdSKrg2ApldvWgpzWWesmeePVSEWTg--0Ry3PyVWnBqlwht3BK0DfieD9pDl0s4Qw/exec";

        // 画像URLリスト（※実際の画像URLに置き換えてください）
        const imageList = [
            "https://via.placeholder.com/400x300/ff7f7f/333333?text=Image+1",
            "https://via.placeholder.com/400x300/7fbfff/333333?text=Image+2",
            "https://via.placeholder.com/400x300/7fff7f/333333?text=Image+3",
            "https://via.placeholder.com/400x300/ffff7f/333333?text=Image+4"
        ];

        const criteriaList = ["かっこいい", "フォーマル", "おしゃれ", "カジュアル"];

        let currentLeft = "";
        let currentRight = "";
        let currentCriterion = "";
        let respondentId = "R_" + Math.floor(Math.random() * 899999 + 100000);

        function nextPair() {
            // ランダムに2枚選出
            let shuffled = [...imageList].sort(() => 0.5 - Math.random());
            currentLeft = shuffled[0];
            currentRight = shuffled[1];
            currentCriterion = criteriaList[Math.floor(Math.random() * criteriaList.length)];

            document.getElementById("imgLeft").src = currentLeft;
            document.getElementById("imgRight").src = currentRight;
            document.getElementById("criterionText").innerText = `「${currentCriterion}」`;
        }

        async function selectImage(winnerSide) {
            const winnerImg = winnerSide === 'left' ? currentLeft : currentRight;
            const loserImg = winnerSide === 'left' ? currentRight : currentLeft;

            const payload = {
                respondent_id: respondentId,
                criterion: currentCriterion,
                winner_img: winnerImg,
                loser_img: loserImg
            };

            // GASへデータ送信（バックグラウンド処理）
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // CORSエラー回避
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            // 次の組み合わせを即座に表示
            nextPair();
        }

        // 初期化
        nextPair();
    </script>
</body>
</html>
